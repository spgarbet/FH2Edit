<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="qunit-2.20.0.css">
    <script src="qunit-2.20.0.js"></script>
    <script src="../default.js"  ></script>
    <script src="../model.js"    ></script>
    <script src="../parser.js"   ></script>
    <script src="../mappings.js" ></script>
    <script>
      QUnit.module("Parse Mappings")
      QUnit.test("Calls works", function(assert) 
      {
        assert.ok(parseMapping( new ByteReader(configSysex), 4));
        assert.ok(parseMappings(new ByteReader(configSysex)));
      });
      
      QUnit.test("Returns default 4", function(assert)
      {
        let x = parseMapping(new ByteReader(configSysex), 4);
        assert.equal(x.channel, 48);
        assert.equal(x.cc,       4);
        assert.equal(x.t0,       0);
        assert.equal(x.t1,       4);
        assert.equal(x.slot,     4);
      });
      
      QUnit.module("nextMappingSlot")
      QUnit.test("Find Empty", function(assert)
      {
        assert.equal(nextMappingSlot(), 8);
        assert.equal(clearMapping(3),   undefined);
        assert.equal(nextMappingSlot(), 3);
        assert.equal(writeMapping(3, "lfo", 3, "DC", 1, 0, false), undefined);
        assert.equal(nextMappingSlot(), 8);
      });
      
      QUnit.module("InverseLUT");
      QUnit.test("Finds Entry", function(assert)
      {
        assert.equal(inverseLUT("LFO", lfoLowControls), 1);
        
      });
      QUnit.test("Fails gracefully", function(assert)
      {
        assert.equal(inverseLUT("LFO", []), null);
        assert.equal(inverseLUT("XXX", lfoLowControls), null);
      });
      
      QUnit.module("Round trip");
      QUnit.test("Mapping Round Trip Single", function(assert)
      {
        x = { slot:        9,
              channel:     7,
              cc:        126,
              relative: true,
              type:     "lfo",
              index:      15,
              dest:     "SAW" };
        writeMapping(x.slot, x.type, x.index, x.dest, x.channel, x.cc, x.relative);
        assert.propEqual(compileMapping(parseMapping(new ByteReader(configSysex), x.slot)), x);
      });
      
      const types =
      {
        lfo:   [lfoLowControls, lfoHighControls],
        arp:   [arpControls],
        euc:   [eucControls],
        mcv:   [mcvControls],
        mcv2:  [mcv2Controls],
        seq:   [seqControls],
        dseq:  [dseqControls],
        dseql: [dseqlControls],
        srr:   [srrControls],
        mcv3:  [mcv3Controls],
        glb:   [globalControls]
      };
      
      for (const [type, tables] of Object.entries(types))
      {
        QUnit.test("All the mappings "+type+" round trip", function(assert)
        {
          for (const table of tables)
          {
            for (let index = 0; index < table.length; ++index)
            {
              const dest = table[index];
              if (dest === null) { continue; }
              let x = 
                  {
                    slot:     Math.floor(Math.random() * 354) + 10,
                    channel:  Math.floor(Math.random() *  16),
                    cc:       Math.floor(Math.random() * 128),
                    relative: Math.random() < 0.5,
                    type,
                    index:    Math.floor(Math.random() *  16),
                    dest
                  };
              if(type === "glb" || type === "dseq" || type === "dseql") x.index=0;
              if(type === "seq") x.index=Math.floor(Math.random()*4);
              console.log("Testing", x.type, x.dest, x.slot);
              writeMapping(x.slot, x.type, x.index, x.dest, x.channel, x.cc, x.relative);
              assert.propEqual(compileMapping(parseMapping(new ByteReader(configSysex), x.slot)), x);
            }
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
  </body>
</html>
