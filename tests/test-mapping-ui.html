<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FH-2 LFO Designer</title>
  <script src="../default.js"  ></script>
  <script src="../model.js"    ></script>
  <script src="../parser.js"   ></script>
  <script src="../mappings.js" ></script>
  <script src="../ui.js"       ></script>
  <script src="../midi-popup.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initMidiMapButtons);
  </script>

<style>
.midi-map-button
{
  width: 24px;
  height: 24px;
  padding: 3px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  box-sizing: border-box;
}


.midi-map-button.assigned
{
  width: auto;
  min-width: 42px;
  padding: 2px 5px;
  border: 1px solid #999;
  border-radius: 3px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.8rem;
  line-height: 20px;
}

.midi-map-popup
{
  position: absolute;
  z-index: 1000;
  min-width: 180px;
  padding: 10px;
  border: 1px solid #999;
  border-radius: 4px;
  background: white;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
}

.midi-map-title
{
  margin-bottom: 20px;
  font-weight: bold;
}

.midi-map-popup label
{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.midi-map-relative
{
  justify-content: flex-start !important;
}

.midi-map-relative input
{
  display: block;
  margin-left:auto;
  margin-right:0;
}

.midi-map-assign button
{
  display: block;
  margin-top: 10px;
  margin-left: auto;
  margin-right: 0;
}

#midi-map-popup img
{
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  display: block;
}

#midi-map-remove
{
  background: transparent;
  padding: 4px;
  border: 1px solid transparent;
}

.midi-map-button img
{
  width: 16px;
  height: 16px;
  display: block;
}

</style>
  
</head>
<body> 
  <div class="lfo-row">
    <label>Center</label>
    <input id="lfo-center" type="range">
    <output id="lfo-center-value">0</output>
    <button class="midi-map-button"
            type="button"
            data-type="lfo"
            data-index="0"
            data-dest="DC"
            aria-label="MIDI assignment for Center">
      <img src="../icons/midi-din.svg" alt="MIDI DIN5">
    </button>
 </div>
 
 <div class="lfo-row">
    <label>Level</label>
    <input id="lfo-level" type="range">
    <output id="lfo-level-value">0</output>
    <button class="midi-map-button"
            type="button"
            data-type="lfo"
            data-index="0"
            data-dest="LFO"
            aria-label="MIDI assignment for Center">
      <img src="../icons/midi-din.svg" alt="MIDI DIN5">
    </button>
 </div>
 
 <div id="midi-map-popup" class="midi-map-popup" hidden>
  <div class="midi-map-title">MIDI Assignment<button id="midi-map-remove" type="button"><img src="../icons/trash.png" alt="Remove Mapping"></button>
</div>
  <label>
    Channel
    <select id="midi-map-channel"><script>optionRange(1,16,1,1)</script></select>
  </label>

  <label>
    CC
    <select id="midi-map-cc"><script>optionRange(0,127,0)</script></select>
    <!-- <input id="midi-map-cc" type="number" min="0" max="127"> -->
  </label>

  <label class="midi-map-relative">
    Relative
    <input id="midi-map-relative" type="checkbox">
  </label>

  <div class="midi-map-assign">
    <button id="midi-map-assign" type="button">Assign</button>
  </div>
</div>
  
</body>
</html>
